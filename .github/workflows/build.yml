name: Build modded APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Apply patch
        run: git apply comfychair-relaxed-import-gguf.patch
      - name: Install side by side (separate app id)
        run: sed -i 's/applicationId = "sh.hnet.comfychair"/applicationId = "sh.hnet.comfychair.mod"/' app/build.gradle.kts
      - name: SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk ComfyChair-mod-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: ComfyChair mod build ${{ github.run_number }}
          body: Unofficial modded build of legal-hkr/comfychair v0.9.6. See README for changes.
          files: ComfyChair-mod-${{ github.run_number }}.apk
