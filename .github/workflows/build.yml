name: Build modded APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Apply patch
        run: git apply comfychair-relaxed-import-gguf.patch
      - name: Install side by side (separate app id)
        run: sed -i 's/applicationId = "sh.hnet.comfychair"/applicationId = "sh.hnet.comfychair.mod"/' app/build.gradle.kts
      - name: SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: comfychair-mod-apk
          path: app/build/outputs/apk/release/*.apk
